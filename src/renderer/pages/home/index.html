<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="./index.css">



    <script src="./index.js" defer></script>
</head>
<body>

    <div id="startup-modal-background" class="">
        <div id="startup-modal">
            <header>
                <h1>Welcome to E621 Easy Experience</h1>
                <h2>e621 Made Easy</h2>
                <p>Some actions in this application require e621 authorization. This information will not be shared with anyone else.</p>
            </header>
            <section>
                <div class="input-field">
                    <h3>Username</h3>
                    <input type="text" id="auth-username">
                </div>
                <div class="input-field">
                    <h3>Auth Token</h3>
                    <input type="text" id="auto-token">
                    <p class="disclaimer">Your auth token is sensitive information, do not share it with anyone you do not absolutely trust.</p>
                </div>
            </section>
            <footer>
                <button class="button-info">Skip</button>
                <button class="button-info">Save</button>
            </footer>
        </div>
    </div>


    <div id="home-top">
        <h1>Home</h1>
    </div>
    <div id="home-queue-preview">
        <h1>Queue</h1>
        <div id="queue-contents" class="flex-group scroll">

        </div>
    </div>
    
</body>
</html>
